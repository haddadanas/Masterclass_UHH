# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "typescript" ]
  pull_request:
    branches: [ "typescript" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Use your project's Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Assumes you have a package.json with dependencies

      - name: Compile Scripts
        run: npm run build # Assumes "build" script compiles TypeScript and builds the site

      - name: Upload build output
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: ./ # Adjust the path to your build output folder, e.g., "dist" or "build"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build output
        uses: actions/download-artifact@v3
        with:
          name: build-output

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./ # Adjust the path to the downloaded artifact folder
